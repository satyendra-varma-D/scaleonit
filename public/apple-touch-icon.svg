<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="apple-scale-bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B0A2A"/>
      <stop offset="100%" stop-color="#0F0518"/>
    </linearGradient>

    <linearGradient id="apple-bar1" x1="0" y1="135" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C53678"/>
      <stop offset="100%" stop-color="#FF7A68"/>
    </linearGradient>

    <linearGradient id="apple-bar2" x1="0" y1="135" x2="0" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C53678"/>
      <stop offset="100%" stop-color="#FF5841"/>
    </linearGradient>

    <linearGradient id="apple-bar3" x1="0" y1="135" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A92661"/>
      <stop offset="50%" stop-color="#C53678"/>
      <stop offset="100%" stop-color="#FF5841"/>
    </linearGradient>

    <linearGradient id="apple-arrow" x1="35" y1="120" x2="145" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C53678" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FF5841"/>
      <stop offset="100%" stop-color="#FF8A78"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" rx="42" fill="url(#apple-scale-bg)"/>
  <rect x="1.5" y="1.5" width="177" height="177" rx="40.5" stroke="#3B1A54" stroke-width="3"/>

  <!-- Scaling Growth Bar 1 -->
  <rect x="36" y="98" width="26" height="42" rx="10" fill="url(#apple-bar1)"/>

  <!-- Scaling Growth Bar 2 -->
  <rect x="77" y="68" width="26" height="72" rx="10" fill="url(#apple-bar2)"/>

  <!-- Scaling Growth Bar 3 -->
  <rect x="118" y="38" width="26" height="102" rx="10" fill="url(#apple-bar3)"/>

  <!-- Dynamic Scaling Surge Trendline -->
  <path
    d="M 36 110 C 65 100, 95 62, 137 38"
    stroke="url(#apple-arrow)"
    stroke-width="10"
    stroke-linecap="round"
  />

  <circle cx="131" cy="44" r="8" fill="#FFFFFF"/>
</svg>
