<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background: Deep Slate/Violet base -->
    <linearGradient id="scale-bg-32" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B0A2A"/>
      <stop offset="100%" stop-color="#0F0518"/>
    </linearGradient>

    <!-- Scaling Bars Gradient 1 (Growth Coral/Rose) -->
    <linearGradient id="bar1-grad-32" x1="0" y1="24" x2="0" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C53678"/>
      <stop offset="100%" stop-color="#FF7A68"/>
    </linearGradient>

    <!-- Scaling Bars Gradient 2 (Vibrant Brand Magenta/Coral) -->
    <linearGradient id="bar2-grad-32" x1="0" y1="24" x2="0" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C53678"/>
      <stop offset="100%" stop-color="#FF5841"/>
    </linearGradient>

    <!-- Scaling Bars Gradient 3 (High-Peak Acceleration Coral) -->
    <linearGradient id="bar3-grad-32" x1="0" y1="24" x2="0" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A92661"/>
      <stop offset="50%" stop-color="#C53678"/>
      <stop offset="100%" stop-color="#FF5841"/>
    </linearGradient>

    <!-- Upward Scaling Rocket/Vector Arrow Gradient -->
    <linearGradient id="arrow-grad-32" x1="6" y1="22" x2="26" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C53678" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FF5841"/>
      <stop offset="100%" stop-color="#FF8A78"/>
    </linearGradient>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="32" height="32" rx="7.5" fill="url(#scale-bg-32)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" stroke="#3B1A54" stroke-width="1"/>

  <!-- Scaling Growth Bar 1 (Left - Base) -->
  <rect x="6.5" y="17.5" width="4.5" height="7.5" rx="2" fill="url(#bar1-grad-32)"/>

  <!-- Scaling Growth Bar 2 (Middle - Growth) -->
  <rect x="13.75" y="12" width="4.5" height="13" rx="2" fill="url(#bar2-grad-32)"/>

  <!-- Scaling Growth Bar 3 (Right - Pinnacle Scale) -->
  <rect x="21" y="6.5" width="4.5" height="18.5" rx="2" fill="url(#bar3-grad-32)"/>

  <!-- Dynamic Scaling Surge Trendline -->
  <path
    d="M 6.5 19.5 C 12 18, 17 11, 24.5 6.5"
    stroke="url(#arrow-grad-32)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Apex Scaled Pulse Spark / Node -->
  <circle cx="23.25" cy="7.5" r="1.5" fill="#FFFFFF"/>
</svg>
