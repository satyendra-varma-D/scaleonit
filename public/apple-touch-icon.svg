<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background rounded square gradient -->
    <linearGradient id="onit-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <!-- Continuous lifecycle ring gradient (Electric Blue -> AI Violet -> Connectivity Cyan) -->
    <linearGradient id="onit-lifecycle" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Central intelligence core gradient -->
    <linearGradient id="onit-core" x1="12" y1="12" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Container: High-contrast Dark Navy rounded rect with subtle border -->
  <rect width="32" height="32" rx="7" fill="url(#onit-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#1E293B" stroke-width="1"/>

  <!-- Connected Lifecycle Arc 1 (Top/Right Flow: 270deg to 150deg) -->
  <!-- R=9.5, Center=(16,16) -->
  <path
    d="M 16 6.5
       A 9.5 9.5 0 1 1 7.77 20.75"
    stroke="url(#onit-lifecycle)"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Upstream Connection Node (Cyan Discovery / Input Node) -->
  <circle cx="7.77" cy="11.25" r="1.7" fill="#0891B2"/>

  <!-- Downstream Execution Node (Violet Code / Delivery Node) -->
  <circle cx="24.23" cy="20.75" r="1.7" fill="#7C3AED"/>

  <!-- Central Intelligent Core (AI Engine / Hub) -->
  <circle cx="16" cy="16" r="3.4" fill="url(#onit-core)"/>
  <circle cx="16" cy="16" r="1.3" fill="#FFFFFF"/>
</svg>
